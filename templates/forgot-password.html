<h2 style="margin-top:0;">Reset your password</h2>
<p>Hi {{firstName}},</p>
<p>We received a request to reset your password. Use the link below within 15 minutes:</p>
<p><a href="{{resetUrl}}" style="background:#6c47ff;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;display:inline-block;">Reset password</a></p>
<p style="font-size:13px;color:#666;">Or use this reset token in the app: <b>{{token}}</b></p>
<p>If you did not request this, you can safely ignore this email.</p>
